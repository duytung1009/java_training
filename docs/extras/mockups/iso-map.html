<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domain Visualizer mockup</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12141a; --panel: #171a21; --line: #2a2e38; --text: #d6d8de; --muted: #7d8290;
    --wh: #e0894f; --hub: #6f9cf0; --price: #a78bfa; --store: #74c48a; --zone: #4fb8b0;
    --wire: #3a404d; --flow: #9ab4ff; --ok: #74c48a; --err: #ef6b6b; --dec: #e0894f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.5 "JetBrains Mono", ui-monospace, monospace; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 13px; letter-spacing: .08em; margin: 0 12px 0 0; }
  header h1 b { color: var(--hub); }
  button { font: inherit; color: var(--text); background: transparent; border: 1px solid var(--line); padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: var(--hub); }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; padding: 8px 16px; color: var(--muted); border-bottom: 1px solid var(--line); }
  .legend i { display: inline-block; width: 9px; height: 9px; margin-right: 6px; border: 1.5px solid; }
  main { display: grid; grid-template-columns: minmax(0, 62fr) minmax(0, 38fr); gap: 12px; padding: 12px 16px; }
  .panel { border: 1px solid var(--line); background: var(--panel); }
  .panel > h2 { font-size: 11px; letter-spacing: .1em; margin: 0; padding: 6px 10px; border-bottom: 1px solid var(--line); color: var(--muted); }
  .map h2 { color: var(--wh); } .log h2 { color: var(--hub); } .diff h2 { color: var(--store); }
  .map { border-color: #4a3426; } .log { border-color: #26344d; } .diff { border-color: #29402f; }
  svg { display: block; width: 100%; height: auto; }
  .right { display: grid; gap: 12px; align-content: start; }
  .log ol { list-style: none; margin: 0; padding: 4px 0; min-height: 220px; max-height: 340px; overflow: auto; }
  .log li { display: grid; grid-template-columns: 92px 52px 1fr 16px; gap: 6px; padding: 3px 10px; cursor: pointer; }
  .log li:hover { background: #1d212a; } .log li.sel { background: #222838; }
  .log .ts, .log .th { color: var(--muted); } .log .m b { color: var(--hub); font-weight: 400; }
  .log .ok { color: var(--ok); } .log .err, .log li.thrown .m { color: var(--err); }
  .diff .body { padding: 8px 10px; min-height: 160px; }
  .diff .obj { margin-bottom: 8px; } .diff .obj > div:first-child { color: var(--muted); }
  .diff .f { display: grid; grid-template-columns: 110px 1fr; padding-left: 12px; }
  .up { color: var(--ok); } .down { color: var(--dec); } .same { color: var(--muted); } .new { color: var(--price); } .gone { color: var(--err); }
  .note { color: var(--muted); } .note.err { color: var(--err); }
  footer { padding: 6px 16px 16px; color: var(--muted); }

  /* ---- Bản đồ ---- */
  .zone-title { font-size: 11px; letter-spacing: .06em; }
  .zone-sub { font-size: 10px; fill: var(--muted); }
  .tile text { font-size: 11px; fill: #101217; font-weight: 600; pointer-events: none; }
  .tile, .zone-frame { transform-box: fill-box; transform-origin: center; }
  .pop-in { animation: popIn .45s cubic-bezier(.3, 1.6, .5, 1) both; }
  .pop-out { animation: popOut .35s ease-in both; }
  .bump-up polygon { animation: bumpUp .6s ease-out; }
  .bump-down polygon { animation: bumpDown .6s ease-out; }
  .flash-ok { animation: flashOk .9s ease-out; }
  .flash-err { animation: flashErr .9s ease-out; }
  .flow { fill: none; stroke-width: 2; stroke-dasharray: 4 10; stroke-linecap: round; animation: flow .5s linear infinite; }
  @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes popOut { to { transform: scale(0); opacity: 0; } }
  @keyframes bumpUp { 30% { stroke: var(--ok); stroke-width: 3; } }
  @keyframes bumpDown { 30% { stroke: var(--dec); stroke-width: 3; } }
  @keyframes flashOk { 30% { stroke: var(--ok); stroke-width: 3; } }
  @keyframes flashErr { 20%, 60% { stroke: var(--err); stroke-width: 3; } }
  @keyframes flow { to { stroke-dashoffset: -14; } }
  @media (prefers-reduced-motion: reduce) { .pop-in, .pop-out, .flow, .bump-up polygon, .bump-down polygon { animation-duration: .01s; } }
  @media (max-width: 1100px) { main { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<header>
  <h1>DOMAIN VISUALIZER · <b>mockup</b></h1>
  <span class="note">kịch bản: demo-tổng-hợp</span>
  <button id="play">▶ Run</button>
  <button id="step">⏭ Step</button>
  <button id="reset">↺ Reset</button>
</header>
<div class="legend">
  <span><i style="border-color:var(--wh)"></i>Warehouse</span>
  <span><i style="border-color:var(--hub)"></i>InventoryManager</span>
  <span><i style="border-color:var(--price)"></i>Pricing</span>
  <span><i style="border-color:var(--store)"></i>Cart / Order</span>
  <span><i style="border-color:var(--zone)"></i>ShippingZone</span>
  <span><i style="border-color:var(--err)"></i>Exception</span>
</div>
<main>
  <section class="panel map"><h2>BẢN ĐỒ 2.5D · domain/</h2><svg id="map" viewBox="0 0 820 490" role="img" aria-label="Bản đồ isometric các domain object"></svg></section>
  <div class="right">
    <section class="panel log"><h2>CALL LOG</h2><ol id="log"></ol></section>
    <section class="panel diff"><h2>STATE CHANGES · before → after</h2><div class="body" id="diff"></div></section>
  </div>
</main>
<footer id="status"></footer>

<script>
const SVGNS = 'http://www.w3.org/2000/svg';
const TW = 64, TH = 32, OX = 360, OY = 56;
const iso = (x, y) => [OX + (x - y) * TW / 2, OY + (x + y) * TH / 2];
const diamond = (x, y, w, d) => [iso(x, y), iso(x + w, y), iso(x + w, y + d), iso(x, y + d)].map(p => p.join(',')).join(' ');
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const sleep = ms => new Promise(r => setTimeout(r, ms));
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}

// ---- Trạng thái mẫu (sẽ lấy từ GET /api/viz/world) ----
const PRODUCT = { LAPTOP: '#e8c46a', PHONE: '#7fd4e0', HEADPHONE: '#b7e07f', BOOK: '#e88fb4' };
const ABBR = { LAPTOP: 'LAP', PHONE: 'PHO', HEADPHONE: 'HDP', BOOK: 'BOK' };
const initWorld = () => ({
  'WH-HN': { LAPTOP: 10, PHONE: 6, HEADPHONE: 4 },
  'WH-HCM': { LAPTOP: 2, PHONE: 4 },
  hub: { LAPTOP: 5, PHONE: 8 },
  pricing: { DISCOUNT: '-10%', TAX: '+8%' },
  cart: {},
  orders: {},
  INNER_CITY: {},
  OTHER_CITY: {},
});
let world = initWorld();

// ---- Zone (panel phẳng) trên nền isometric, toạ độ ô lưới ----
const ZONES = {
  'WH-HN':    { x: 0,    y: 0,   w: 3.4, d: 2.6, color: '--wh',    title: 'Warehouse WH-HN', sub: 'Map<productId, qty>' },
  'WH-HCM':   { x: 0,    y: 4.4, w: 3.4, d: 2.6, color: '--wh',    title: 'Warehouse WH-HCM', sub: 'Map<productId, qty>' },
  hub:        { x: 5.5,  y: 1.5, w: 3.4, d: 3.2, color: '--hub',   title: 'InventoryManager', sub: 'Product.stock' },
  cart:       { x: 10,   y: 0,   w: 3,   d: 2.6, color: '--store', title: 'Cart', sub: 'Map<Product, qty>' },
  pricing:    { x: 10,   y: 3.8, w: 3,   d: 1.3, color: '--price', title: 'Pricing', sub: 'discount · tax', tileW: 1.1 },
  orders:     { x: 10,   y: 6.1, w: 3,   d: 2,   color: '--store', title: 'Order', sub: 'snapshot giá', tileW: 2.4 },
  INNER_CITY: { x: 10,   y: 9.4, w: 3,   d: 1.6, color: '--zone',  title: 'INNER_CITY', sub: 'Hà Nội', tileW: 2.4 },
  OTHER_CITY: { x: 5.5,  y: 9.4, w: 3,   d: 1.6, color: '--zone',  title: 'OTHER_CITY', sub: 'tỉnh khác', tileW: 2.4 },
};
// Đường nối: thứ tự điểm = chiều "xuôi"; event có reverse thì chạy ngược
const WIRES = {
  transfer: [[1.7, 2.6], [1.7, 4.4]],
  catalog:  [[8.9, 2.5], [9.4, 2.5], [9.4, 1.1], [10, 1.1]],
  checkout: [[11.5, 2.6], [11.5, 6.1]],
  stock:    [[10, 7.1], [9.4, 7.1], [9.4, 4], [8.9, 4]],
  shipIn:   [[11.5, 8.1], [11.5, 9.4]],
  shipOut:  [[10.6, 8.1], [10.6, 8.8], [7, 8.8], [7, 9.4]],
};
const MISSING = [[3.4, 2], [5.5, 2]];

const layers = {};
const tiles = {};     // `${zone}/${key}` → { g, text, value }
const frames = {};

function wirePath(pts) { return pts.map((p, i) => (i ? 'L' : 'M') + iso(...p).join(' ')).join(' '); }

function buildScene() {
  const svg = document.getElementById('map');
  svg.textContent = '';
  const defs = el('defs', {}, svg);
  for (const [id, c] of [['arrow-flow', css('--flow')], ['arrow-err', css('--err')]]) {
    const m = el('marker', { id, viewBox: '0 0 10 10', refX: 7, refY: 5, markerWidth: 6, markerHeight: 6, orient: 'auto' }, defs);
    el('path', { d: 'M1 1L8 5L1 9', fill: 'none', stroke: c, 'stroke-width': 1.6 }, m);
  }
  for (const n of ['ground', 'wires', 'zones', 'flows', 'labels']) layers[n] = el('g', {}, svg);

  for (let x = -0.5; x < 13.5; x++) for (let y = -0.5; y < 11.5; y++)
    el('polygon', { points: diamond(x, y, 1, 1), fill: 'none', stroke: '#1b1f27' }, layers.ground);

  for (const pts of Object.values(WIRES))
    el('path', { d: wirePath(pts), fill: 'none', stroke: css('--wire'), 'stroke-width': 1.5 }, layers.wires);
  el('path', { d: wirePath(MISSING), fill: 'none', stroke: css('--wire'), 'stroke-width': 1, 'stroke-dasharray': '2 5' }, layers.wires);
  const [mx, my] = iso(4.45, 2);
  const mt = el('text', { x: mx, y: my + 18, 'text-anchor': 'middle', class: 'zone-sub' }, layers.labels);
  mt.textContent = 'WH → hub: chưa có';

  for (const [id, z] of Object.entries(ZONES)) {
    const color = css(z.color);
    const g = el('g', { id: 'zone-' + id }, layers.zones);
    frames[id] = el('polygon', { points: diamond(z.x, z.y, z.w, z.d), fill: color, 'fill-opacity': 0.05, stroke: color, 'stroke-width': 1.5, class: 'zone-frame' }, g);
    const [tx, ty] = iso(z.x, z.y);
    const t = el('text', { x: tx, y: ty - 18, 'text-anchor': 'middle', class: 'zone-title', fill: color }, layers.labels);
    t.textContent = z.title;
    const s = el('text', { x: tx, y: ty - 6, 'text-anchor': 'middle', class: 'zone-sub' }, layers.labels);
    s.textContent = z.sub;
  }
}

function items(id) {
  const data = world[id];
  if (id === 'orders') return Object.entries(data).map(([k, v]) => ({ key: k, text: `${k} ${v}`, color: '#c9b6ff' }));
  if (id === 'pricing') return Object.entries(data).map(([k, v]) => ({ key: k, text: v, color: '#c9b6ff' }));
  if (id.endsWith('CITY')) return Object.entries(data).map(([k, v]) => ({ key: k, text: `${k} ${v}`, color: '#8fe0d6' }));
  return Object.entries(data).map(([k, v]) => ({ key: k, text: `${ABBR[k]} ${v}`, value: v, color: PRODUCT[k] }));
}

// Đồng bộ ô con với world: ô mới pop-in, ô mất pop-out, số đổi thì đếm dần + nháy viền
function sync() {
  for (const [id, z] of Object.entries(ZONES)) {
    const list = items(id), tw = z.tileW || 1.3, td = 0.9, gap = 0.2;
    const cols = Math.max(1, Math.floor((z.w - 0.3) / (tw + gap)));
    const seen = new Set();
    list.forEach((it, i) => {
      const k = `${id}/${it.key}`;
      seen.add(k);
      const tx = z.x + 0.3 + (i % cols) * (tw + gap), ty = z.y + 0.35 + Math.floor(i / cols) * (td + gap);
      let t = tiles[k];
      if (!t) {
        const g = el('g', { class: 'tile pop-in' }, document.getElementById('zone-' + id));
        el('polygon', { points: diamond(tx, ty, tw, td), fill: it.color, 'fill-opacity': 0.9, stroke: '#0e1015', 'stroke-width': 1 }, g);
        const [cx, cy] = iso(tx + tw / 2, ty + td / 2);
        const text = el('text', { x: cx, y: cy + 3.5, 'text-anchor': 'middle' }, g);
        text.textContent = it.text;
        el('title', {}, g).textContent = `${ZONES[id].title} · ${it.key}`;
        tiles[k] = { g, text, value: it.value };
        return;
      }
      t.g.querySelector('polygon').setAttribute('points', diamond(tx, ty, tw, td));
      const [cx, cy] = iso(tx + tw / 2, ty + td / 2);
      t.text.setAttribute('x', cx); t.text.setAttribute('y', cy + 3.5);
      if (it.value !== undefined && it.value !== t.value) {
        countTo(t, it.value, ABBR[it.key]);
        t.g.classList.remove('pop-in', 'bump-up', 'bump-down');
        void t.g.getBBox();
        t.g.classList.add(it.value > t.value ? 'bump-up' : 'bump-down');
        t.value = it.value;
      }
    });
    for (const k of Object.keys(tiles)) {
      if (k.startsWith(id + '/') && !seen.has(k)) {
        const g = tiles[k].g;
        delete tiles[k];
        g.classList.remove('pop-in'); g.classList.add('pop-out');
        setTimeout(() => g.remove(), 380);
      }
    }
  }
}
function countTo(t, to, abbr) {
  const from = t.value, start = performance.now();
  (function frame(now) {
    const f = Math.min(1, (now - start) / 500);
    t.text.textContent = `${abbr} ${Math.round(from + (to - from) * f)}`;
    if (f < 1) requestAnimationFrame(frame);
  })(start);
}
function flashZone(id, ok) {
  const f = frames[id];
  f.classList.remove('flash-ok', 'flash-err'); void f.getBBox();
  f.classList.add(ok ? 'flash-ok' : 'flash-err');
}
// Chỉ đường có action mới chạy: dash chảy theo hướng data, đầu mũi tên ở đích
async function flow(wire, reverse, ok) {
  const pts = WIRES[wire].slice();
  if (reverse) pts.reverse();
  const color = ok ? css('--flow') : css('--err');
  const p = el('path', { d: wirePath(pts), class: 'flow', stroke: color, 'marker-end': `url(#arrow-${ok ? 'flow' : 'err'})` }, layers.flows);
  await sleep(900);
  p.style.transition = 'opacity .3s'; p.style.opacity = 0;
  setTimeout(() => p.remove(), 300);
}

// ---- Event mẫu (sẽ lấy từ POST /api/viz/scenarios/{id}/run) ----
const EVENTS = [
  { call: 'InventoryManager.addProduct', args: 'Product(BOOK, stock 12)', ok: true, zones: ['hub'],
    changes: [{ ref: 'InventoryManager', before: { products: 2 }, after: { products: 3 } }, { ref: 'Product BOOK', before: null, after: { stock: 12 } }],
    apply: w => { w.hub.BOOK = 12; } },
  { call: 'WarehouseTransferService.transfer', args: 'WH-HN, WH-HCM, LAPTOP, 3', ok: true, wire: 'transfer', zones: ['WH-HN', 'WH-HCM'],
    changes: [{ ref: 'Warehouse WH-HN', before: { LAPTOP: 10 }, after: { LAPTOP: 7 } }, { ref: 'Warehouse WH-HCM', before: { LAPTOP: 2 }, after: { LAPTOP: 5 } }],
    apply: w => { w['WH-HN'].LAPTOP -= 3; w['WH-HCM'].LAPTOP += 3; } },
  { call: 'WarehouseTransferService.transfer', args: 'WH-HN, WH-HCM, HEADPHONE, 2', ok: true, wire: 'transfer', zones: ['WH-HN', 'WH-HCM'],
    changes: [{ ref: 'Warehouse WH-HN', before: { HEADPHONE: 4 }, after: { HEADPHONE: 2 } }, { ref: 'Warehouse WH-HCM', before: { HEADPHONE: undefined }, after: { HEADPHONE: 2 } }],
    apply: w => { w['WH-HN'].HEADPHONE -= 2; w['WH-HCM'].HEADPHONE = 2; } },
  { th: 'pool-2', call: 'WarehouseTransferService.transfer', args: 'WH-HCM, WH-HN, PHONE, 9', ok: false,
    error: 'OutOfStockException: PHONE cần 9, còn 4', wire: 'transfer', reverse: true, zones: ['WH-HCM'], changes: [] },
  { call: 'Cart.add', args: 'LAPTOP, 1', ok: true, wire: 'catalog', zones: ['cart'],
    changes: [{ ref: 'Cart', before: { LAPTOP: undefined }, after: { LAPTOP: 1 } }], apply: w => { w.cart.LAPTOP = 1; } },
  { call: 'Cart.add', args: 'PHONE, 2', ok: true, wire: 'catalog', zones: ['cart'],
    changes: [{ ref: 'Cart', before: { PHONE: undefined }, after: { PHONE: 2 } }], apply: w => { w.cart.PHONE = 2; } },
  { call: 'Cart.add', args: 'BOOK, 1', ok: true, wire: 'catalog', zones: ['cart'],
    changes: [{ ref: 'Cart', before: { BOOK: undefined }, after: { BOOK: 1 } }], apply: w => { w.cart.BOOK = 1; } },
  { call: 'Cart.remove', args: 'BOOK', ok: true, zones: ['cart'],
    changes: [{ ref: 'Cart', before: { BOOK: 1 }, after: { BOOK: undefined } }], apply: w => { delete w.cart.BOOK; } },
  { call: 'Cart.toOrder', args: '0.10, 0.08', ok: true, wire: 'checkout', zones: ['pricing', 'orders'],
    changes: [{ ref: 'Order #a1f3', before: null, after: { lines: 2, subtotal: '34 000 000', discount: '3 400 000', tax: '2 448 000', final: '33 048 000' } }],
    apply: w => { w.orders['#a1f3'] = '33.0tr'; } },
  { call: 'InventoryManager.decreaseStock', args: 'Order #a1f3', ok: true, wire: 'stock', zones: ['hub'],
    changes: [{ ref: 'Product LAPTOP', before: { stock: 5 }, after: { stock: 4 } }, { ref: 'Product PHONE', before: { stock: 8 }, after: { stock: 6 } }],
    apply: w => { w.hub.LAPTOP -= 1; w.hub.PHONE -= 2; } },
  { call: 'InventoryManager.decreaseStock', args: 'Order #b7c2', ok: false,
    error: 'OutOfStockException: LAPTOP cần 9, còn 4', wire: 'stock', zones: ['hub'], changes: [] },
  { call: 'ShippingZone.of → feeFor', args: 'Address(Hà Nội), 1.5kg', ok: true, result: 'INNER_CITY, 27 500', pure: true,
    wire: 'shipIn', zones: ['INNER_CITY'], changes: [], apply: w => { w.INNER_CITY['#a1f3'] = '27.5k'; } },
  { call: 'ShippingZone.of → feeFor', args: 'Address(Đà Nẵng), 2kg', ok: true, result: 'OTHER_CITY, 45 000', pure: true,
    wire: 'shipOut', zones: ['OTHER_CITY'], changes: [], apply: w => { w.OTHER_CITY['#c9d0'] = '45.0k'; } },
];

let cursor = 0, playing = false, selected = -1;
const t0 = Date.parse('2026-11-01T10:00:00.100Z');

function renderLog() {
  const ol = document.getElementById('log');
  ol.textContent = '';
  EVENTS.slice(0, cursor).forEach((e, i) => {
    const li = document.createElement('li');
    li.className = (e.ok ? '' : 'thrown ') + (i === selected ? 'sel' : '');
    const ts = new Date(t0 + i * 137).toISOString().slice(11, 23);
    const dot = e.call.indexOf('.');
    li.innerHTML = `<span class="ts">${ts}</span><span class="th">${e.th || 'main'}</span>` +
      `<span class="m">${e.call.slice(0, dot)}.<b>${e.call.slice(dot + 1)}</b>(${e.args})${e.ok ? (e.result ? ' → ' + e.result : '') : '<br>✗ ' + e.error}</span>` +
      `<span class="${e.ok ? 'ok' : 'err'}">${e.ok ? '✓' : '✗'}</span>`;
    li.onclick = () => { selected = i; renderLog(); renderDiff(); e.zones.forEach(z => flashZone(z, e.ok)); };
    ol.appendChild(li);
  });
  const done = EVENTS.slice(0, cursor);
  document.getElementById('status').textContent =
    `step ${cursor}/${EVENTS.length} · threads ${new Set(done.map(e => e.th || 'main')).size} · exceptions ${done.filter(e => !e.ok).length}`;
}
function renderDiff() {
  const box = document.getElementById('diff');
  const e = EVENTS[selected];
  if (!e) { box.innerHTML = '<span class="note">Chọn một dòng log hoặc bấm Run.</span>'; return; }
  if (!e.ok) { box.innerHTML = `<div class="note err">✗ ${e.error}</div><div class="note">Không object nào đổi — all-or-nothing.</div>`; return; }
  if (e.pure) { box.innerHTML = `<div class="note">Hàm thuần: trả ${e.result}, không đổi state.</div>`; return; }
  box.innerHTML = e.changes.map(c => {
    const keys = [...new Set([...Object.keys(c.before || {}), ...Object.keys(c.after)])];
    const rows = keys.map(k => {
      const b = c.before?.[k], a = c.after[k];
      let cls, txt;
      if (c.before === null || b === undefined) { cls = 'new'; txt = `+ ${a}`; }
      else if (a === undefined) { cls = 'gone'; txt = `${b} → (xoá)`; }
      else { cls = b === a ? 'same' : (typeof a === 'number' && a > b ? 'up' : 'down'); txt = `${b} → ${a}`; }
      return `<div class="f"><span>${k}</span><span class="${cls}">${txt}</span></div>`;
    }).join('');
    return `<div class="obj"><div>${c.ref}${c.before === null ? ' <span class="new">(mới tạo)</span>' : ''}</div>${rows}</div>`;
  }).join('');
}

async function step() {
  if (cursor >= EVENTS.length) return;
  const e = EVENTS[cursor];
  if (e.wire) await flow(e.wire, e.reverse, e.ok);
  if (e.apply) e.apply(world);
  sync();
  e.zones.forEach(z => flashZone(z, e.ok));
  cursor++; selected = cursor - 1;
  renderLog(); renderDiff();
}
document.getElementById('step').onclick = () => { if (!playing) step(); };
document.getElementById('play').onclick = async () => {
  if (playing) return;
  playing = true;
  while (cursor < EVENTS.length) { await step(); await sleep(500); }
  playing = false;
};
document.getElementById('reset').onclick = () => {
  if (playing) return;
  world = initWorld(); cursor = 0; selected = -1;
  for (const k of Object.keys(tiles)) delete tiles[k];
  buildScene(); sync(); renderLog(); renderDiff();
};
buildScene(); sync(); renderLog(); renderDiff();
</script>
</body>
