# Profile local không có database: chỉ cần loại DataSourceAutoConfiguration (Boot 4: package org.springframework.boot.jdbc.autoconfigure).
# Các autoconfig JDBC còn lại (JdbcClient, JdbcTemplate, transaction manager, khởi tạo SQL) tự lùi vì
# chúng phụ thuộc vào bean DataSource duy nhất (@ConditionalOnSingleCandidate(DataSource)).
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
