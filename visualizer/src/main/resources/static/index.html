<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domain Visualizer</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="adapter/theme.css">
</head>
<body>
<header>
  <h1>DOMAIN VISUALIZER</h1>
  <span id="badge" class="badge" hidden>fixture</span>
  <select id="scenario" aria-label="Kịch bản"></select>
  <button id="run">▶ Run</button>
  <button id="pause">⏸ Pause</button>
  <button id="back">⏮ Back</button>
  <button id="step">⏭ Step</button>
  <select id="speed" aria-label="Tốc độ">
    <option value="0.5">0.5×</option>
    <option value="1" selected>1×</option>
    <option value="2">2×</option>
  </select>
  <button id="reset">↺ Reset</button>
  <button id="model-btn" class="model-btn" title="Trình sửa mô hình domain (context, vai trò, quan hệ)">Mô hình</button>
  <button id="about" class="about-btn" title="Hành trình phát triển visualizer" aria-label="Hành trình phát triển visualizer">?</button>
</header>
<div class="legend"><!-- mục legend của domain do adapter.legend thêm vào đầu (main.js) -->
  <span><i style="border-color:var(--err)"></i>Exception</span>
  <span><i style="border-color:var(--muted)"></i>object</span>
  <span><i class="k-coll" style="border-color:var(--muted)"></i>collection</span>
  <span><i class="k-area" style="border-color:var(--muted)"></i>package</span>
  <span><i class="k-calc" style="border-color:var(--muted)"></i>dynamic value</span>
</div>
<div id="sync" class="sync" role="alert" hidden></div>
<main>
  <section class="panel map"><h2><em id="map-title">BẢN ĐỒ ISOMETRIC 2.5D · domain/</em> <span id="map-hint">· click một khối để xem chú thích</span><span id="crumbs" class="crumbs"></span><span id="lv-switch" class="lv-switch" role="group" aria-label="Tầng xem"></span></h2><div id="filter-bar" class="filter-bar" aria-label="Bộ lọc"></div><div class="map-view"><svg id="map" role="img" aria-label="Bản đồ isometric các domain object"></svg><svg id="level-map" class="level-map" role="img" aria-label="Bản đồ theo tầng context / aggregate" hidden></svg></div><aside id="info" class="info" hidden></aside></section>
  <div class="right">
    <section class="panel log"><h2>CALL LOG</h2><ol id="log"></ol></section>
    <section class="panel diff"><h2>STATE CHANGES · before → after</h2><div class="body" id="diff"></div></section>
  </div>
</main>
<footer id="status"></footer>
<aside id="model-editor" class="model-editor" aria-label="Trình sửa mô hình domain" hidden></aside>
<dialog id="about-dlg" class="about" aria-label="Hành trình phát triển visualizer">
  <div class="about-top"><h2>HÀNH TRÌNH · DOMAIN VISUALIZER</h2><button class="about-close" aria-label="Đóng">×</button></div>
  <div class="about-body"></div>
</dialog>
<script type="module" src="js/main.js"></script>
</body>
</html>
