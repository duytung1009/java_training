# Profile dev: PostgreSQL. Ghi đè bằng biến môi trường SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD (docker compose làm vậy).
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce
spring.datasource.username=ecommerce
spring.datasource.password=ecommerce

# Chạy schema.sql + data.sql lúc khởi động (Postgres không phải DB embedded nên mặc định Boot sẽ bỏ qua)
spring.sql.init.mode=always
